name: Refresh README

# Auto-regenerates the dynamic sections of README.md after every push to
# main. Runs scripts/update-readme-stats.py and commits the result back
# to the same branch if it changed. This is the server-side counterpart
# to the local pre-commit hook at .githooks/pre-commit, so README keeps
# refreshing even when commits are made from clients (e.g. the GitHub
# mobile app) that don't run local hooks.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so the auto-commit can land cleanly.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate README
        run: python scripts/update-readme-stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README is up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto-refresh README stats [skip hook]"
          git push
